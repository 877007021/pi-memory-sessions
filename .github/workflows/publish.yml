name: Publish

# Publishes to npm through Trusted Publishing (OIDC): no npm token, no OTP,
# and the release is signed with provenance.
#
# One-time setup on npmjs.com (package → Settings → Trusted Publisher):
#   Publisher:       GitHub Actions
#   Organization:    877007021
#   Repository:      pi-memory-sessions
#   Workflow name:   publish.yml
#   Environment:     (leave empty)
#
# Then release with:  npm version patch && git push --follow-tags
# or by creating a GitHub release for the tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC -> npm Trusted Publishing

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      # Trusted Publishing requires a recent npm; Node 22 bundles one that is
      # new enough, but pin the floor so a future image does not regress.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11
          npm --version

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Tests
        run: node --test --test-reporter=spec test/unit.test.ts

      - name: Capability check
        run: node --no-warnings bench/capabilities.ts

      - name: Publish
        run: npm publish --provenance --access public
